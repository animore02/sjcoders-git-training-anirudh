<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-4">Employee Management</h1>
    <div id="message"></div>
    <div class="card mb-4">
        <div class="card-header">
            Add Employee
        </div>

        <div class="card-body">

            <form id="employeeForm">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Employee Code</label>
                        <input
                            type="text"
                            id="employeeCode"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input
                        type="text"
                        id="fullName"
                        class="form-control"
                        required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input
                        type="email"
                        id="email"
                        class="form-control"
                        required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input
                            type="text"
                            id="phone"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Department</label>
                        <input
                            type="text"
                            placeholder="ex.Engineering"
                            id="department"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Role</label>

                        <input 
                            type="text"
                            placeholder="Ex. Intern"
                            id="role"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>

                        <select id="status" class="form-select">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>

                </div>
                <button type="submit" class="btn btn-primary"> Add Employee </button>
            </form>
        </div>
    </div>


  
    <div class="card mb-4">
        <div class="card-body">
            <div class="input-group">
                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search by name or employee code">

                <button id="searchButton" class="btn btn-secondary">Search </button>

                <button id="resetButton" class="btn btn-outline-secondary"> Show All</button>
            </div>
        </div>
    </div>


    <div class="card">
        <div class="card-header">Employees List</div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Employee Code</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody id="employeeTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>

</body>

</html>
